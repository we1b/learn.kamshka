<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كمشكاة | الإعدادات</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { primary: '#015c3a', secondary: '#f4f1ea', accent: '#ea580c', light: '#ffffff', dark: '#1e293b' } }, fontFamily: { sans: ['"IBM Plex Sans Arabic"', 'sans-serif'], } } } }
    </script>
</head>
<body class="bg-[#fcfbf9] text-brand-dark font-sans flex flex-col min-h-screen">
    
    <div id="authLock" class="fixed inset-0 z-[100] bg-[#fcfbf9]/95 backdrop-blur-sm flex flex-col items-center justify-center hidden">
        <h2 class="text-3xl font-bold text-brand-dark mb-4">المحتوى مقفول 🔒</h2>
        <button onclick="localStorage.setItem('kameshkah_auth', 'true'); window.location.reload();" class="px-8 py-4 bg-brand-primary text-white font-bold rounded-xl shadow-lg">تسجيل الدخول الآن</button>
    </div>

    <header class="bg-brand-light shadow-sm sticky top-0 z-50 border-b border-brand-primary/10">
        <div class="container mx-auto px-4 py-3 flex items-center gap-4">
            <a href="profile.html" class="text-slate-400 hover:text-brand-primary p-2 transition-colors">
                <svg class="w-6 h-6 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <h1 class="text-xl font-bold text-brand-dark">الإعدادات</h1>
        </div>
    </header>

    <main class="flex-grow py-8">
        <div class="container mx-auto px-4 max-w-2xl">
            
            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 mb-6">
                <h3 class="font-bold text-brand-primary mb-6 border-b border-slate-100 pb-2">المعلومات الشخصية</h3>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">الاسم بالكامل</label>
                        <input type="text" value="مصطفى عبد الناصر" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-brand-secondary/30 outline-none focus:border-brand-primary transition-colors font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">البريد الإلكتروني</label>
                        <input type="email" value="mustafa@example.com" disabled class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-slate-100 outline-none text-slate-500 cursor-not-allowed">
                        <p class="text-xs text-slate-400 mt-1">لا يمكن تغيير البريد الإلكتروني حالياً.</p>
                    </div>
                    <button type="button" onclick="alert('تم حفظ التعديلات بنجاح!')" class="px-6 py-3 bg-brand-primary text-white font-bold rounded-xl shadow-md hover:bg-opacity-90 transition-colors mt-4">حفظ التعديلات</button>
                </form>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8">
                <h3 class="font-bold text-brand-accent mb-6 border-b border-slate-100 pb-2">التنبيهات والإشعارات</h3>
                <div class="space-y-4">
                    <label class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-slate-50 transition-colors">
                        <span class="font-medium text-slate-700">تذكير يومي بمتابعة التعلم</span>
                        <input type="checkbox" checked class="w-5 h-5 accent-brand-primary rounded cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-slate-50 transition-colors">
                        <span class="font-medium text-slate-700">تنبيهات النشرة البريدية الأسبوعية</span>
                        <input type="checkbox" checked class="w-5 h-5 accent-brand-primary rounded cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-slate-50 transition-colors">
                        <span class="font-medium text-slate-700">إشعارات التحديات الجديدة (قريباً)</span>
                        <input type="checkbox" disabled class="w-5 h-5 accent-slate-300 rounded cursor-not-allowed">
                    </label>
                </div>
            </div>

        </div>
    </main>

    <script>
        function checkAuth() { if (localStorage.getItem('kameshkah_auth') !== 'true') { document.getElementById('authLock').classList.remove('hidden'); document.body.style.overflow = 'hidden'; } }
        window.onload = checkAuth;
    </script>
</body>
</html>
