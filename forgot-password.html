<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كمشكاة | استعادة كلمة المرور</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { primary: '#015c3a', secondary: '#f4f1ea', accent: '#ea580c', light: '#ffffff', dark: '#1e293b' } }, fontFamily: { sans: ['"IBM Plex Sans Arabic"', 'sans-serif'], } } } }
    </script>
</head>
<body class="bg-[#fcfbf9] text-brand-dark font-sans flex items-center justify-center min-h-screen p-4">
    
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-brand-secondary p-8 md:p-10 text-center">
        
        <div class="w-16 h-16 bg-brand-secondary text-brand-primary rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
        </div>

        <h1 class="text-2xl font-bold text-brand-dark mb-2">نسيت كلمة المرور؟</h1>
        <p class="text-slate-500 text-sm mb-8 leading-relaxed">أدخل بريدك الإلكتروني المسجل لدينا وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</p>

        <form onsubmit="event.preventDefault(); alert('تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني.'); window.location.href='login.html';" class="space-y-5 text-right">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">البريد الإلكتروني</label>
                <input type="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-primary outline-none transition-colors bg-slate-50 focus:bg-white" placeholder="أدخل بريدك الإلكتروني">
            </div>
            
            <button type="submit" class="w-full py-3.5 bg-brand-primary text-white rounded-xl font-bold hover:bg-opacity-90 shadow-md transition-colors">
                إرسال الرابط
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-8">
            <a href="login.html" class="font-bold text-brand-primary hover:underline flex items-center justify-center gap-1">
                <svg class="w-4 h-4 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                العودة لتسجيل الدخول
            </a>
        </p>
    </div>

</body>
</html>
