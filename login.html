<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كمشكاة | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { primary: '#015c3a', secondary: '#f4f1ea', accent: '#ea580c', light: '#ffffff', dark: '#1e293b' } }, fontFamily: { sans: ['"IBM Plex Sans Arabic"', 'sans-serif'], } } } }
    </script>
</head>
<body class="bg-[#fcfbf9] text-brand-dark font-sans flex items-center justify-center min-h-screen p-4">
    
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-brand-secondary p-8 md:p-10 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-primary rounded-full opacity-10 blur-2xl"></div>
        
        <div class="text-center mb-8 relative z-10">
            <a href="index.html" class="inline-block mb-4">
                <img src="Untitled-1.jpg" alt="شعار" class="h-12 object-contain mix-blend-multiply mx-auto">
            </a>
            <h1 class="text-2xl font-bold text-brand-dark">أهلاً بك مجدداً</h1>
            <p class="text-slate-500 text-sm mt-1">سجل دخولك لمتابعة رحلة تعلمك.</p>
        </div>

        <form onsubmit="event.preventDefault(); localStorage.setItem('kameshkah_auth', 'true'); window.location.href='dashboard.html';" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">البريد الإلكتروني</label>
                <input type="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-primary outline-none transition-colors bg-slate-50 focus:bg-white" placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-slate-700">كلمة المرور</label>
                    <a href="forgot-password.html" class="text-xs font-bold text-brand-primary hover:underline">نسيت كلمة المرور؟</a>
                </div>
                <input type="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-primary outline-none transition-colors bg-slate-50 focus:bg-white" placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="w-full py-3.5 bg-brand-primary text-white rounded-xl font-bold text-lg hover:bg-opacity-90 shadow-md transition-transform transform hover:-translate-y-0.5">
                دخول
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-8 relative z-10">
            ليس لديك حساب؟ <a href="signup.html" class="font-bold text-brand-primary hover:underline">إنشاء حساب جديد</a>
        </p>
    </div>

</body>
</html>
