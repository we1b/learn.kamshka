<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كمشكاة | تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { primary: '#015c3a', secondary: '#f4f1ea', accent: '#ea580c', light: '#ffffff', dark: '#1e293b' } }, fontFamily: { sans: ['"IBM Plex Sans Arabic"', 'sans-serif'], } } } }
    </script>
</head>
<body class="bg-[#fcfbf9] text-brand-dark font-sans flex flex-col min-h-screen">
    <header class="bg-brand-light shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2"><img src="Untitled-1.jpg" alt="شعار" class="h-12 object-contain mix-blend-multiply"></a>
        </div>
    </header>

    <main class="flex-grow py-16">
        <div class="container mx-auto px-4 max-w-3xl">
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold text-brand-dark mb-4">تواصل معنا</h1>
                <div class="w-24 h-1.5 bg-brand-accent mx-auto rounded-full mb-6"></div>
            </div>

            <div class="bg-white rounded-3xl shadow-xl p-8 border border-brand-secondary">
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" placeholder="الاسم" class="w-full p-4 rounded-xl border border-slate-200 outline-none">
                        <input type="email" placeholder="البريد" class="w-full p-4 rounded-xl border border-slate-200 outline-none">
                    </div>
                    <textarea rows="5" placeholder="رسالتك..." class="w-full p-4 rounded-xl border border-slate-200 outline-none"></textarea>
                    <button class="w-full py-4 rounded-xl bg-brand-primary text-white font-bold">إرسال الرسالة</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
